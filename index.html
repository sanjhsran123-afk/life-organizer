    <!-- Open Graph / Facebook -->

    <meta name="twitter:image" content="https://life-organizer-52s.pages.dev/icons/icon-512.png" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DayLedger",
      "url": "https://life-organizer-52s.pages.dev/",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "All",
      "description": "An all-in-one life organizer app combining smart task management, personal loan and debt tracking, contacts, notes, and daily routines in one secure, private workspace.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Smart Task & Priority Management",
        "Lent & Borrowed Financial Ledger",
        "Relationship & Contact Notes",
        "Instant Tagged Notes & Checklists",
        "GPS Location & Maps Satellite View",
        "Offline-Ready Progressive Web App"
      ]
    }
    </script>

    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DayLedger" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dayledger_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#09090b');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAF9] dark:bg-[#09090B] text-[#18181B] dark:text-[#F4F4F5] antialiased selection:bg-indigo-100 dark:selection:bg-indigo-950 selection:text-indigo-900 dark:selection:text-indigo-200 overflow-x-hidden min-h-screen transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
